name: Build Reynard

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to build
        required: true
        type: string
      nightly:
        description: Build nightly version
        required: false
        default: false
        type: boolean
      build_normal_ipa:
        description: Build normal IPA
        required: false
        default: true
        type: boolean
      build_trollstore_tipa:
        description: Build TrollStore TIPA
        required: false
        default: true
        type: boolean
      build_jailbroken_ipa:
        description: Build Jailbroken IPA
        required: false
        default: true
        type: boolean
      stage_ios27_input:
        description: Upload Gecko/idevice link inputs for the Xcode 27 compatibility job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ github.repository == 'xytxg/reynard-browser-zh' }}
    name: Select build variants
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_build: ${{ steps.matrix.outputs.should_build }}
      build_standard: ${{ steps.matrix.outputs.build_standard }}
      build_nojemalloc: ${{ steps.matrix.outputs.build_nojemalloc }}
    steps:
      - name: Select matrix
        id: matrix
        uses: actions/github-script@v9
        env:
          BUILD_NORMAL_IPA: ${{ inputs.build_normal_ipa }}
          BUILD_TROLLSTORE_TIPA: ${{ inputs.build_trollstore_tipa }}
          BUILD_JAILBROKEN_IPA: ${{ inputs.build_jailbroken_ipa }}
        with:
          script: |
            // Standard and TrollStore packages share one Gecko build. Jailbroken
            // needs its own Gecko because --disable-jemalloc changes
            // mozilla-config.h and therefore every compiled object.
            const variants = [];
            const standard =
              process.env.BUILD_NORMAL_IPA === 'true' ||
              process.env.BUILD_TROLLSTORE_TIPA === 'true';
            const nojemalloc = process.env.BUILD_JAILBROKEN_IPA === 'true';

            if (standard) {
              variants.push({ variant: 'standard' });
            }

            if (nojemalloc) {
              variants.push({ variant: 'nojemalloc' });
            }

            core.setOutput('matrix', JSON.stringify({ include: variants }));
            core.setOutput('should_build', String(variants.length > 0));
            core.setOutput('build_standard', String(standard));
            core.setOutput('build_nojemalloc', String(nojemalloc));

  # Each Gecko flavor is compiled exactly once per run, in parallel. A pass
  # that reaches its time budget uploads its object directory and the next
  # pass continues the same build, so no job runs into the 6 hour limit. A
  # cold build (new Firefox or toolchain) needs two or three passes; the
  # fourth is the last one allowed and fails if Gecko is still unfinished.
  gecko-standard-p1:
    needs: prepare
    if: ${{ needs.prepare.outputs.build_standard == 'true' }}
    uses: ./.github/workflows/build-gecko.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      flavor: standard
      build_args: --use-sccache --auto-clobber

  gecko-standard-p2:
    needs: [prepare, gecko-standard-p1]
    if: ${{ !cancelled() && needs.gecko-standard-p1.result == 'success' && needs.gecko-standard-p1.outputs.resume == 'true' }}
    uses: ./.github/workflows/build-gecko.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      flavor: standard
      build_args: --use-sccache --auto-clobber
      pass: 2
      rust_toolchain: ${{ needs.gecko-standard-p1.outputs.rust_toolchain }}
      xcode_version: ${{ needs.gecko-standard-p1.outputs.xcode_version }}

  gecko-standard-p3:
    needs: [prepare, gecko-standard-p1, gecko-standard-p2]
    if: ${{ !cancelled() && needs.gecko-standard-p2.result == 'success' && needs.gecko-standard-p2.outputs.resume == 'true' }}
    uses: ./.github/workflows/build-gecko.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      flavor: standard
      build_args: --use-sccache --auto-clobber
      pass: 3
      rust_toolchain: ${{ needs.gecko-standard-p1.outputs.rust_toolchain }}
      xcode_version: ${{ needs.gecko-standard-p1.outputs.xcode_version }}

  gecko-standard-p4:
    needs: [prepare, gecko-standard-p1, gecko-standard-p2, gecko-standard-p3]
    if: ${{ !cancelled() && needs.gecko-standard-p3.result == 'success' && needs.gecko-standard-p3.outputs.resume == 'true' }}
    uses: ./.github/workflows/build-gecko.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      flavor: standard
      build_args: --use-sccache --auto-clobber
      pass: 4
      rust_toolchain: ${{ needs.gecko-standard-p1.outputs.rust_toolchain }}
      xcode_version: ${{ needs.gecko-standard-p1.outputs.xcode_version }}
      final_pass: true

  gecko-nojemalloc-p1:
    needs: prepare
    if: ${{ needs.prepare.outputs.build_nojemalloc == 'true' }}
    uses: ./.github/workflows/build-gecko.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      flavor: nojemalloc
      build_args: --disable-jemalloc --use-sccache --auto-clobber

  gecko-nojemalloc-p2:
    needs: [prepare, gecko-nojemalloc-p1]
    if: ${{ !cancelled() && needs.gecko-nojemalloc-p1.result == 'success' && needs.gecko-nojemalloc-p1.outputs.resume == 'true' }}
    uses: ./.github/workflows/build-gecko.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      flavor: nojemalloc
      build_args: --disable-jemalloc --use-sccache --auto-clobber
      pass: 2
      rust_toolchain: ${{ needs.gecko-nojemalloc-p1.outputs.rust_toolchain }}
      xcode_version: ${{ needs.gecko-nojemalloc-p1.outputs.xcode_version }}

  gecko-nojemalloc-p3:
    needs: [prepare, gecko-nojemalloc-p1, gecko-nojemalloc-p2]
    if: ${{ !cancelled() && needs.gecko-nojemalloc-p2.result == 'success' && needs.gecko-nojemalloc-p2.outputs.resume == 'true' }}
    uses: ./.github/workflows/build-gecko.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      flavor: nojemalloc
      build_args: --disable-jemalloc --use-sccache --auto-clobber
      pass: 3
      rust_toolchain: ${{ needs.gecko-nojemalloc-p1.outputs.rust_toolchain }}
      xcode_version: ${{ needs.gecko-nojemalloc-p1.outputs.xcode_version }}

  gecko-nojemalloc-p4:
    needs: [prepare, gecko-nojemalloc-p1, gecko-nojemalloc-p2, gecko-nojemalloc-p3]
    if: ${{ !cancelled() && needs.gecko-nojemalloc-p3.result == 'success' && needs.gecko-nojemalloc-p3.outputs.resume == 'true' }}
    uses: ./.github/workflows/build-gecko.yml
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      flavor: nojemalloc
      build_args: --disable-jemalloc --use-sccache --auto-clobber
      pass: 4
      rust_toolchain: ${{ needs.gecko-nojemalloc-p1.outputs.rust_toolchain }}
      xcode_version: ${{ needs.gecko-nojemalloc-p1.outputs.xcode_version }}
      final_pass: true

  build:
    needs:
      - prepare
      - gecko-standard-p1
      - gecko-standard-p2
      - gecko-standard-p3
      - gecko-standard-p4
      - gecko-nojemalloc-p1
      - gecko-nojemalloc-p2
      - gecko-nojemalloc-p3
      - gecko-nojemalloc-p4
    # Runs after whichever Gecko jobs ran; each leg checks its own flavor, so
    # one broken flavor does not block the other variant's packages.
    if: ${{ !cancelled() && needs.prepare.outputs.should_build == 'true' }}
    name: "${{ matrix.variant == 'standard' && 'Package Standard / TrollStore' || 'Package Jailbroken' }}"
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Require a finished Gecko build
        env:
          VARIANT: ${{ matrix.variant }}
          STANDARD_COMPLETE: ${{ needs.gecko-standard-p1.outputs.complete == 'true' || needs.gecko-standard-p2.outputs.complete == 'true' || needs.gecko-standard-p3.outputs.complete == 'true' || needs.gecko-standard-p4.outputs.complete == 'true' }}
          NOJEMALLOC_COMPLETE: ${{ needs.gecko-nojemalloc-p1.outputs.complete == 'true' || needs.gecko-nojemalloc-p2.outputs.complete == 'true' || needs.gecko-nojemalloc-p3.outputs.complete == 'true' || needs.gecko-nojemalloc-p4.outputs.complete == 'true' }}
        run: |
          set -euo pipefail
          if [[ "$VARIANT" == "standard" ]]; then complete="$STANDARD_COMPLETE"; else complete="$NOJEMALLOC_COMPLETE"; fi
          if [[ "$complete" != "true" ]]; then
            echo "Gecko $VARIANT did not finish; see its Gecko jobs." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      # Same toolchain as the Gecko jobs, so idevice keeps building with the
      # compilers it always used.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Download Gecko packaging inputs
        uses: actions/download-artifact@v4
        with:
          name: gecko-dist-${{ matrix.variant }}
          path: ${{ runner.temp }}/gecko-dist

      - name: Restore Gecko into the source layout
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/gecko-dist"
          gecko_dist="engine/firefox/obj-aarch64-apple-ios/dist"
          default_theme="engine/firefox/toolkit/mozapps/extensions/default-theme"
          mkdir -p "$gecko_dist/bin" "$gecko_dist/include" "$default_theme"
          rsync -a "$stage/bin/" "$gecko_dist/bin/"
          rsync -a "$stage/include/" "$gecko_dist/include/"
          rsync -a "$stage/default-theme/" "$default_theme/"
          test -s "$gecko_dist/bin/XUL"
          test -d "$gecko_dist/include/GeckoView"
          test -n "$(find "$default_theme" -type f -print -quit)"

      - name: Initialize idevice submodule
        run: |
          set -euo pipefail
          git submodule sync --recursive -- support/idevice
          git submodule update --init --recursive support/idevice

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Hash Rust toolchain for cache
        id: rust_toolchain
        run: echo "hash=$(rustc -Vv | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: |
            support/idevice/target
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          key: buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-${{ hashFiles('support/idevice/Cargo.lock', 'support/idevice/Cargo.toml', 'tools/development/build-idevice.sh') }}
          restore-keys: |
            buildcache-idevice-${{ steps.rust_toolchain.outputs.hash }}-

      - name: Build idevice support library
        run: ./tools/development/build-idevice.sh

      - name: Stage Xcode 27 compatibility inputs
        if: ${{ matrix.variant == 'standard' && inputs.stage_ios27_input }}
        run: |
          set -euo pipefail
          compat_input="$RUNNER_TEMP/reynard-ios27-input"
          gecko_dist="engine/firefox/obj-aarch64-apple-ios/dist"
          rm -rf "$compat_input"
          mkdir -p "$compat_input/gecko/bin" "$compat_input/gecko/include" \
            "$compat_input/firefox/toolkit/mozapps/extensions/default-theme"
          for directory in bin include; do
            rsync -aL "$gecko_dist/$directory/" "$compat_input/gecko/$directory/"
          done
          rsync -aL \
            "engine/firefox/toolkit/mozapps/extensions/default-theme/" \
            "$compat_input/firefox/toolkit/mozapps/extensions/default-theme/"
          test -n "$(find "$compat_input/firefox/toolkit/mozapps/extensions/default-theme" -type f -print -quit)"
          install -m 0644 browser/Reynard/JIT/RPPairing/libidevice_ffi.a \
            "$compat_input/libidevice_ffi.a"
          test -s "$compat_input/gecko/bin/XUL"
          du -sh "$compat_input"

      - name: Upload Xcode 27 compatibility inputs
        if: ${{ matrix.variant == 'standard' && inputs.stage_ios27_input }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-ios27-input
          path: ${{ runner.temp }}/reynard-ios27-input
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Install packaging dependencies
        run: brew install ldid

      - name: Build app
        run: ./tools/release/build-app.sh --no-signing ${{ inputs.nightly && '--nightly' || '' }}

      - name: Create IPA
        if: ${{ matrix.variant == 'standard' && inputs.build_normal_ipa }}
        run: ./tools/release/create-ipa.sh

      - name: Create TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && inputs.build_trollstore_tipa }}
        run: ./tools/release/create-ipa.sh --trollstore

      - name: Create Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && inputs.build_jailbroken_ipa }}
        run: ./tools/release/create-ipa.sh --jailbroken

      - name: Upload IPA
        if: ${{ matrix.variant == 'standard' && inputs.build_normal_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard.ipa
          path: dist/Reynard.ipa
          if-no-files-found: error

      - name: Upload TrollStore TIPA
        if: ${{ matrix.variant == 'standard' && inputs.build_trollstore_tipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-TrollStore.tipa
          path: dist/Reynard-TrollStore.tipa
          if-no-files-found: error

      - name: Upload Jailbroken IPA
        if: ${{ matrix.variant == 'nojemalloc' && inputs.build_jailbroken_ipa }}
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-Jailbroken.ipa
          path: dist/Reynard-Jailbroken.ipa
          if-no-files-found: error
