name: Build three unsigned IPA variants

run-name: Three IPA variants · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - sync/**

permissions:
  contents: read

concurrency:
  group: three-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      build_normal_ipa: true
      build_trollstore_tipa: true
      build_jailbroken_ipa: true

  ios27-compatibility:
    name: Xcode 27 / iOS 27 SDK compatibility
    needs: build
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Download source-built link inputs
        uses: actions/download-artifact@v4
        with:
          name: Reynard-ios27-input
          path: ${{ runner.temp }}/reynard-ios27-input

      - name: Restore Gecko and idevice inputs
        run: |
          set -euo pipefail
          compat_input="$RUNNER_TEMP/reynard-ios27-input"
          gecko_dist="engine/firefox/obj-aarch64-apple-ios/dist"
          default_theme="engine/firefox/toolkit/mozapps/extensions/default-theme"
          mkdir -p "$gecko_dist" "$default_theme" browser/Reynard/JIT/RPPairing
          rsync -a "$compat_input/gecko/" "$gecko_dist/"
          rsync -a "$compat_input/firefox/toolkit/mozapps/extensions/default-theme/" \
            "$default_theme/"
          install -m 0644 "$compat_input/libidevice_ffi.a" \
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          test -s "$gecko_dist/bin/XUL"
          test -d "$gecko_dist/include/GeckoView"
          test -n "$(find "$default_theme" -type f -print -quit)"

      - name: Verify Xcode 27 toolchain
        run: |
          set -euo pipefail
          mkdir -p dist/logs
          xcodebuild -version | tee dist/logs/xcode27-toolchain.log
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK $sdk_version" | tee -a dist/logs/xcode27-toolchain.log
          test "${sdk_version%%.*}" -ge 27

      - name: Verify the shipping project still targets iOS 13
        run: |
          set -euo pipefail
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET = 13.0' browser/Configuration/Reynard.xcconfig
          grep -Fq 'DEPLOYMENT_TARGET="13.0"' tools/development/build-idevice.sh
          grep -Fq -- '--enable-ios-target=13.0' tools/development/build-gecko.sh

      - name: Compile against the iOS 27 SDK with its supported minimum
        env:
          # Xcode 27 no longer accepts deployment targets below iOS 15. The
          # shipping Xcode/Gecko/idevice build still targets iOS 13; this
          # separate job verifies source compatibility with the iOS 27 SDK.
          REYNARD_DEPLOYMENT_TARGET_OVERRIDE: "15.0"
        run: tools/release/build-unsigned-app.sh

      - name: Verify linked SDK and deployment target
        run: |
          set -euo pipefail
          app_path="dist/Reynard.app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          minimum_os="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app_path/Info.plist")"
          test "$minimum_os" = "15.0"
          xcrun vtool -show-build "$app_path/$executable" | tee dist/logs/xcode27-load-commands.log
          grep -Eq 'minos[[:space:]]+15(\.0+)?[[:space:]]*$' dist/logs/xcode27-load-commands.log
          grep -Eq 'sdk[[:space:]]+27(\.|$)' dist/logs/xcode27-load-commands.log

      - name: Upload Xcode 27 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-ios27-compatibility
          path: dist/logs
          if-no-files-found: warn
          retention-days: 30
