name: Build Nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      build_normal_ipa:
        description: Build normal IPA
        required: false
        default: true
        type: boolean
      build_trollstore_tipa:
        description: Build TrollStore TIPA
        required: false
        default: true
        type: boolean
      build_jailbroken_ipa:
        description: Build Jailbroken IPA
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Skip unchanged scheduled builds
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Compare with the last successful nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed lookup must not silently disable nightlies, so fall back to building.
          last_sha="$(
            gh run list --repo "$GITHUB_REPOSITORY" --workflow build-nightly.yml \
              --branch "$GITHUB_REF_NAME" --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""' 2>/dev/null || true
          )"
          if [[ -n "$last_sha" && "$last_sha" == "$GITHUB_SHA" ]]; then
            echo "No new commits since the last successful nightly ($last_sha); skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: ${{ needs.changes.outputs.should_build == 'true' }}
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}
      nightly: true
      build_normal_ipa: ${{ github.event_name == 'schedule' || inputs.build_normal_ipa }}
      build_trollstore_tipa: ${{ github.event_name == 'schedule' || inputs.build_trollstore_tipa }}
      build_jailbroken_ipa: ${{ github.event_name == 'schedule' || inputs.build_jailbroken_ipa }}
