name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Reynard IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -euo pipefail
          MIN_IPHONEOS_SDK="26.4"

          version_ge() {
            awk -v a="$1" -v b="$2" '
              BEGIN {
                n = split(a, av, ".")
                m = split(b, bv, ".")
                max = n > m ? n : m
                for (i = 1; i <= max; i++) {
                  ai = av[i] + 0
                  bi = bv[i] + 0
                  if (ai > bi) exit 0
                  if (ai < bi) exit 1
                }
                exit 0
              }
            '
          }

          XCODE_PATH=""
          while IFS= read -r candidate; do
            developer_dir="$candidate/Contents/Developer"
            sdk_version="$(DEVELOPER_DIR="$developer_dir" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)"
            echo "$candidate -> iPhoneOS SDK ${sdk_version:-unavailable}"
            if [ -n "$sdk_version" ] && version_ge "$sdk_version" "$MIN_IPHONEOS_SDK"; then
              XCODE_PATH="$candidate"
              break
            fi
          done < <(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -r)

          if [ -z "$XCODE_PATH" ] && [ -d /Applications/Xcode.app ]; then
            sdk_version="$(DEVELOPER_DIR="/Applications/Xcode.app/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2>/dev/null || true)"
            echo "/Applications/Xcode.app -> iPhoneOS SDK ${sdk_version:-unavailable}"
            if [ -n "$sdk_version" ] && version_ge "$sdk_version" "$MIN_IPHONEOS_SDK"; then
              XCODE_PATH="/Applications/Xcode.app"
            fi
          fi

          if [ -z "$XCODE_PATH" ]; then
            echo "No Xcode installation with iPhoneOS SDK >= $MIN_IPHONEOS_SDK found in /Applications"
            ls -la /Applications | grep Xcode || true
            exit 1
          fi

          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install tools
        run: |
          brew update
          brew install ldid
          rustup target add aarch64-apple-ios

      - name: Download Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Build idevice support
        run: ./tools/development/build-idevice.sh

      - name: Build Gecko
        run: ./tools/development/build-gecko.sh

      - name: Archive app
        run: ./tools/release/build-app.sh

      - name: Create IPA
        run: ./tools/release/create-ipa.sh

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPAs
          path: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p dist/diagnostics
          {
            echo "## Git"
            git status --short || true
            echo
            echo "## Engine release"
            cat engine/release.txt || true
            echo
            echo "## Xcode"
            xcodebuild -version || true
            echo
            echo "## Rust"
            rustc --version || true
            cargo --version || true
            echo
            echo "## Gecko status"
            git -C engine/firefox status --short || true
            git -C engine/firefox log --oneline -1 || true
            echo
            echo "## idevice status"
            git -C support/idevice status --short || true
            git -C support/idevice log --oneline -1 || true
          } > dist/diagnostics/build-context.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: dist/diagnostics
