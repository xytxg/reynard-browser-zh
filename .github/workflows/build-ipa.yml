name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Reynard IPA
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install tools
        run: |
          brew update
          brew install ldid
          rustup target add aarch64-apple-ios

      - name: Download Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Build idevice support
        run: ./tools/development/build-idevice.sh

      - name: Build Gecko
        run: ./tools/development/build-gecko.sh

      - name: Archive app
        run: ./tools/release/build-app.sh

      - name: Create IPA
        run: ./tools/release/create-ipa.sh

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPAs
          path: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p dist/diagnostics
          {
            echo "## Git"
            git status --short || true
            echo
            echo "## Engine release"
            cat engine/release.txt || true
            echo
            echo "## Xcode"
            xcodebuild -version || true
            echo
            echo "## Rust"
            rustc --version || true
            cargo --version || true
            echo
            echo "## Gecko status"
            git -C engine/firefox status --short || true
            git -C engine/firefox log --oneline -1 || true
            echo
            echo "## idevice status"
            git -C support/idevice status --short || true
            git -C support/idevice log --oneline -1 || true
          } > dist/diagnostics/build-context.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Diagnostics
          path: dist/diagnostics
