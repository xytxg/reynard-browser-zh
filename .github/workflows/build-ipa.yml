name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Reynard IPA
    runs-on: macos-15
    timeout-minutes: 720

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install tools
        run: |
          brew update
          brew install ldid
          rustup target add aarch64-apple-ios

      - name: Prepare submodules
        run: |
          if ! git submodule status -- engine/firefox >/dev/null 2>&1; then
            rm -rf engine/firefox
            git submodule add --depth 1 https://github.com/mozilla-firefox/firefox engine/firefox
          fi

          if ! git submodule status -- support/idevice >/dev/null 2>&1; then
            rm -rf support/idevice
            git submodule add https://github.com/jkcoxson/idevice support/idevice
          fi

      - name: Download Gecko source
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        run: ./tools/development/apply-patches.sh

      - name: Build idevice support
        run: ./tools/development/build-idevice.sh

      - name: Build Gecko
        run: ./tools/development/build-gecko.sh

      - name: Archive app
        run: ./tools/release/build-app.sh

      - name: Create IPA
        run: ./tools/release/create-ipa.sh

      - name: Upload IPA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-IPAs
          path: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
