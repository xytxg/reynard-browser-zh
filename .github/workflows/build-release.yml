name: Build Release

on:
  push:
    tags:
      - '*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]')
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.event_name == 'push' && github.sha || inputs.tag }}
      build_normal_ipa: true
      build_trollstore_tipa: true
      build_jailbroken_ipa: true

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve release tag
        id: metadata
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$(tr -d '\r\n' < .github/release-tag)"
          fi
          test -n "$tag"
          notes=".github/release-notes/$tag.md"
          test -s "$notes"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          token: ${{ github.token }}
          name: Reynard Browser 中文版 0.13.1
          body_path: ${{ steps.metadata.outputs.notes }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/Reynard.ipa
            dist/Reynard-TrollStore.tipa
            dist/Reynard-Jailbroken.ipa
