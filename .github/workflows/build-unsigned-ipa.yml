name: Build unsigned IPA from source

run-name: Unsigned IPA · ${{ github.ref_name }} · ${{ github.event_name }}

# Tests run on every PR. Full builds use the same resumable workflow as Nightly.
# Only same-repository PRs with [build ipa] in the title build packages.
# Formal publishing is exclusively handled by build-release.yml.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Static checks and pure Swift tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: latest
      - name: Validate localization, download safety, and Swift syntax
        env:
          REQUIRE_SWIFT: "1"
        run: |
          set -euo pipefail
          mkdir -p dist/test-results
          xcodebuild -version
          tools/tests/run-static-tests.sh 2>&1 | tee dist/test-results/quality.log
          find browser -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
      - name: Upload quality results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Reynard-quality-${{ github.run_number }}
          path: dist/test-results
          retention-days: 30


  # Reuse the tested Nightly/Release workflow, which checkpoints Gecko objects
  # between macOS Jobs instead of hitting the six-hour single-Job limit.
  build-ipa:
    name: Resumable Gecko + standard/TrollStore packages
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.title, '[build ipa]'))
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      build_normal_ipa: true
      build_trollstore_tipa: true
      build_jailbroken_ipa: false
      stage_ios27_input: true

  verify-packages:
    name: Verify built standard IPA and TrollStore TIPA
    needs: build-ipa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download IPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Reynard.ipa
          path: dist/normal
      - name: Download TIPA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Reynard-TrollStore.tipa
          path: dist/trollstore
      - name: Require a real IPA artifact
        run: |
          set -euo pipefail
          test -s dist/normal/Reynard.ipa
          test -s dist/trollstore/Reynard-TrollStore.tipa
          test "$(stat -c %s dist/normal/Reynard.ipa)" -gt 1000000
          test "$(stat -c %s dist/trollstore/Reynard-TrollStore.tipa)" -gt 1000000
          sha256sum dist/normal/Reynard.ipa dist/trollstore/Reynard-TrollStore.tipa | tee dist/SHA256SUMS.txt
          {
            echo '## Resumable source build verified'
            echo
            echo "- Commit: $GITHUB_SHA"
            echo '- Verified: standard IPA and TrollStore TIPA'
            echo '- These are unsigned CI artifacts, not a stable release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Reynard-PR-SHA256SUMS
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  ios27-compatibility:
    name: Xcode 27 / iOS 27 SDK compatibility
    needs: [quality, build-ipa]
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Download source-built link inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Reynard-ios27-input
          path: ${{ runner.temp }}/reynard-ios27-input

      - name: Restore Gecko and idevice inputs
        run: |
          set -euo pipefail
          compat_input="$RUNNER_TEMP/reynard-ios27-input"
          gecko_dist="engine/firefox/obj-aarch64-apple-ios/dist"
          default_theme="engine/firefox/toolkit/mozapps/extensions/default-theme"
          mkdir -p "$gecko_dist" "$default_theme" browser/Reynard/JIT/RPPairing
          rsync -a "$compat_input/gecko/" "$gecko_dist/"
          rsync -a "$compat_input/firefox/toolkit/mozapps/extensions/default-theme/" \
            "$default_theme/"
          install -m 0644 "$compat_input/libidevice_ffi.a" \
            browser/Reynard/JIT/RPPairing/libidevice_ffi.a
          test -s "$gecko_dist/bin/XUL"
          test -d "$gecko_dist/include/GeckoView"
          test -n "$(find "$default_theme" -type f -print -quit)"

      - name: Verify Xcode 27 toolchain
        run: |
          set -euo pipefail
          mkdir -p dist/logs
          xcodebuild -version | tee dist/logs/xcode27-toolchain.log
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK $sdk_version" | tee -a dist/logs/xcode27-toolchain.log
          test "${sdk_version%%.*}" -ge 27

      - name: Verify the shipping project still targets iOS 13
        run: |
          set -euo pipefail
          grep -Fq 'IPHONEOS_DEPLOYMENT_TARGET = 13.0' browser/Configuration/Reynard.xcconfig
          grep -Fq 'DEPLOYMENT_TARGET="13.0"' tools/development/build-idevice.sh
          grep -Fq -- '--enable-ios-target=13.0' tools/development/build-gecko.sh

      - name: Compile against the iOS 27 SDK with its supported minimum
        env:
          # Xcode 27 no longer accepts deployment targets below iOS 15. The
          # shipping Xcode/Gecko/idevice build above still targets iOS 13;
          # this separate job verifies source compatibility with the iOS 27 SDK.
          REYNARD_DEPLOYMENT_TARGET_OVERRIDE: "15.0"
        run: tools/release/build-unsigned-app.sh

      - name: Verify linked SDK and deployment target
        run: |
          set -euo pipefail
          app_path="dist/Reynard.app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Info.plist")"
          minimum_os="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app_path/Info.plist")"
          test "$minimum_os" = "15.0"
          xcrun vtool -show-build "$app_path/$executable" | tee dist/logs/xcode27-load-commands.log
          grep -Eq 'minos[[:space:]]+15(\.0+)?[[:space:]]*$' dist/logs/xcode27-load-commands.log
          grep -Eq 'sdk[[:space:]]+27(\.|$)' dist/logs/xcode27-load-commands.log

      - name: Upload Xcode 27 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Reynard-ios27-compatibility-${{ github.run_number }}
          path: dist/logs
          if-no-files-found: warn
          retention-days: 30
