name: Build unsigned IPA from source

run-name: Unsigned IPA · ${{ github.ref_name }} · ${{ github.event_name }}

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promote-verified-ipa:
    name: Promote verified IPA to formal release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[promote verified ipa]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, reverify, and publish the source-built IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.10.1-zh.1
          RELEASE_TARGET: 8b32f413e8ac8027c7f373a9a9fbce181a5e2ebf
          RELEASE_TREE: 6627347ded7c9ff2cdfe37c2f3f1d988cd592ba9
          SOURCE_COMMIT: c73a4cc0ad563e058bd814ba1831c07f70ceb9ca
          SOURCE_RUN: "33246451796"
          SOURCE_ARTIFACT: Reynard-source-unsigned-18
          EXPECTED_IPA_SHA256: 20e31f7e50859845419fe6611eac1bf85e01ca5f2f1004f5e021e4ca5eda66ba
        run: |
          set -euo pipefail

          test "$(git rev-parse "$RELEASE_TARGET^{tree}")" = "$RELEASE_TREE"
          test "$(git rev-parse "$SOURCE_COMMIT^{tree}")" = "$RELEASE_TREE"

          run_json="$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json conclusion,event,headSha)"
          test "$(jq -r .conclusion <<< "$run_json")" = "success"
          test "$(jq -r .event <<< "$run_json")" = "pull_request"
          test "$(jq -r .headSha <<< "$run_json")" = "$SOURCE_COMMIT"

          artifact_dir="$RUNNER_TEMP/reynard-formal-release"
          mkdir -p "$artifact_dir"
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir "$artifact_dir"

          ipa_path="$artifact_dir/Reynard-0.10.1-c73a4cc-unsigned.ipa"
          test -s "$ipa_path"
          actual_sha256="$(shasum -a 256 "$ipa_path" | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$EXPECTED_IPA_SHA256"
          python3 tools/release/verify-unsigned-ipa.py "$ipa_path" | tee "$artifact_dir/verification.json"

          checksum_path="$ipa_path.sha256"
          printf '%s  %s\n' "$actual_sha256" "$(basename "$ipa_path")" > "$checksum_path"
          notes_path="$artifact_dir/release-notes.md"
          {
            echo '## Reynard Browser 中文版 0.10.1'
            echo
            echo '- 类型：正式版'
            printf -- '- 标签：`%s`\n' "$RELEASE_TAG"
            printf -- '- 发布目标：`%s`\n' "$RELEASE_TARGET"
            printf -- '- 已验证源码：`%s`\n' "$SOURCE_COMMIT"
            printf -- '- 源码树：`%s`\n' "$RELEASE_TREE"
            printf -- '- 完整构建：[Run #%s](https://github.com/%s/actions/runs/%s)\n' \
              "18" "$GITHUB_REPOSITORY" "$SOURCE_RUN"
            echo
            echo '> **未签名构建：此 IPA 不能直接安装。**'
            echo '> 请使用 TrollStore、AltStore、SideStore、个人证书或其他兼容方式签名/侧载，并保留 App Extensions。'
            echo
            echo '该 IPA 已重新校验 SHA-256、arm64 Mach-O、签名元数据、iOS 13 最低版本、Gecko/XUL、两个扩展与简体中文资源。'
          } > "$notes_path"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ipa_path#未签名 IPA" "$checksum_path#SHA-256 校验" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title 'Reynard Browser 中文版 0.10.1' --notes-file "$notes_path" \
              --draft=false --prerelease=false
          else
            gh release create "$RELEASE_TAG" "$ipa_path#未签名 IPA" "$checksum_path#SHA-256 校验" \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" \
              --title 'Reynard Browser 中文版 0.10.1' --notes-file "$notes_path"
          fi

  quality:
    name: Static checks and pure Swift tests
    if: >-
      github.event_name != 'push' ||
      !contains(github.event.head_commit.message, '[promote verified ipa]')
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Validate localization, download safety, and Swift syntax
        env:
          REQUIRE_SWIFT: "1"
        run: |
          set -euo pipefail
          mkdir -p dist/test-results
          xcodebuild -version
          tools/tests/run-static-tests.sh 2>&1 | tee dist/test-results/quality.log
          find browser -name '*.swift' -print0 | xargs -0 xcrun swiftc -frontend -parse
      - name: Upload quality results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-quality-${{ github.run_number }}
          path: dist/test-results
          retention-days: 30

  build-ipa:
    name: Build Gecko and unsigned IPA
    needs: quality
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.title, '[build ipa]'))
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: unsigned-gecko-v1
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      RUSTC_WRAPPER: sccache
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Set up latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      # Follow upstream's successful Firefox 154.0.1 toolchain. Mach bootstrap
      # selects its matching WASI sysroot/compiler-rt instead of mixing LLVM versions.
      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install python@3.12 lld cbindgen llvm
          echo "$(brew --prefix python@3.12)/libexec/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Inspect and fingerprint build toolchain
        id: toolchain
        run: |
          set -euo pipefail
          mkdir -p dist/logs
          {
            xcodebuild -version
            python3 --version
            clang --version
            ld64.lld --version
            cbindgen --version
            rustc -Vv
          } | tee dist/logs/toolchain.log
          echo "key=$(shasum -a 256 dist/logs/toolchain.log | cut -c1-20)" >> "$GITHUB_OUTPUT"
          echo "idevice=$(git rev-parse HEAD:support/idevice)" >> "$GITHUB_OUTPUT"
          df -h | tee dist/logs/disk-before.log

      - name: Initialize idevice source
        run: git submodule update --init --recursive --depth 1 support/idevice

      - name: Restore build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.mozbuild
          key: gecko-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('engine/release.txt') }}
          restore-keys: |
            gecko-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-

      - name: Restore idevice build cache
        uses: actions/cache@v4
        with:
          path: support/idevice/target
          key: idevice-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ steps.toolchain.outputs.idevice }}-${{ hashFiles('tools/development/build-idevice.sh') }}

      - name: Download exact Gecko source and apply project patches
        run: |
          set -euo pipefail
          tools/development/update-gecko.sh 2>&1 | tee dist/logs/update-gecko.log
          test "$(git -C engine/firefox rev-parse HEAD)" = "$(git rev-parse HEAD:engine/firefox)"
          tools/development/apply-patches.sh 2>&1 | tee dist/logs/apply-patches.log

      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Restore exact Gecko distribution cache
        id: gecko-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reynard-gecko-dist
          key: gecko-dist-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('engine/release.txt', 'patches/**/*.patch', 'tools/development/build-gecko.sh') }}

      - name: Build Gecko for iOS
        env:
          CC: clang
          CXX: clang++
          LD: ld64.lld
          GECKO_CACHE_HIT: ${{ steps.gecko-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          gecko_dist="$GITHUB_WORKSPACE/engine/firefox/obj-aarch64-apple-ios/dist"
          if [[ "$GECKO_CACHE_HIT" == "true" ]]; then
            mkdir -p "$gecko_dist"
            rsync -a "$RUNNER_TEMP/reynard-gecko-dist/" "$gecko_dist/"
            echo "Restored source-built Gecko with exact source/toolchain cache key." | tee dist/logs/build-gecko.log
          else
            tools/development/build-gecko.sh --use-sccache --auto-clobber 2>&1 | tee dist/logs/build-gecko.log
          fi
          test -s "$gecko_dist/bin/XUL"
          test -d "$gecko_dist/include/GeckoView"
          df -h | tee dist/logs/disk-after-gecko.log

      - name: Materialize self-contained Gecko distribution
        id: materialize-gecko
        if: steps.gecko-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reynard-gecko-dist/bin" "$RUNNER_TEMP/reynard-gecko-dist/include"
          # dist contains symlinks into generated object directories. Dereference
          # them so a cached distribution works on a fresh runner without old objects.
          # Xcode only needs bin and include. dist/lib contains large intermediate
          # archives and copying them can exhaust the runner after a successful build.
          for directory in bin include; do
            rsync -aL --delete "engine/firefox/obj-aarch64-apple-ios/dist/$directory/" "$RUNNER_TEMP/reynard-gecko-dist/$directory/"
          done
          du -sh "$RUNNER_TEMP/reynard-gecko-dist"

      - name: Save exact Gecko distribution cache
        if: steps.materialize-gecko.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/reynard-gecko-dist
          key: ${{ steps.gecko-cache.outputs.cache-primary-key }}

      - name: Build idevice support library
        run: |
          set -euo pipefail
          tools/development/build-idevice.sh 2>&1 | tee dist/logs/build-idevice.log
          test -s browser/Reynard/JIT/RPPairing/libidevice_ffi.a

      - name: Build unsigned Reynard.app
        run: tools/release/build-unsigned-app.sh

      - name: Package and verify unsigned IPA
        id: package
        run: |
          set -euo pipefail
          version="$(awk -F ' = ' '/^CURRENT_VERSION = / { print $2; exit }' browser/Configuration/Reynard.xcconfig)"
          short_sha="$(git rev-parse --short=7 HEAD)"
          ipa_name="Reynard-${version}-${short_sha}-unsigned.ipa"
          tools/release/create-unsigned-ipa.sh dist/Reynard.app "dist/$ipa_name" 2>&1 | tee dist/logs/package-ipa.log
          shasum -a 256 "dist/$ipa_name" | tee "dist/$ipa_name.sha256"
          echo "ipa-name=$ipa_name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload IPA and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-source-unsigned-${{ github.run_number }}
          path: |
            dist/*.ipa
            dist/*.sha256
            dist/logs
          if-no-files-found: warn
          retention-days: 30

      - name: Require a real IPA artifact
        env:
          IPA_NAME: ${{ steps.package.outputs.ipa-name }}
        run: |
          set -euo pipefail
          test -n "$IPA_NAME"
          test -s "dist/$IPA_NAME"

      - name: Publish successful build release
        id: release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_NAME: ${{ steps.package.outputs.ipa-name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_title="Reynard Browser 中文版 $VERSION"
            release_kind="版本标签构建"
            prerelease="false"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] &&
               git log -1 --pretty=%B | grep -Fq '[formal release]'; then
            release_tag="v${VERSION}-zh.1"
            release_title="Reynard Browser 中文版 $VERSION"
            release_kind="正式版本构建"
            prerelease="false"
          else
            release_tag="build-$GITHUB_RUN_NUMBER"
            release_title="Reynard Browser 中文版 $VERSION · Build $GITHUB_RUN_NUMBER"
            release_kind="自动源码构建"
            prerelease="true"
          fi

          note_file="dist/release-notes.md"
          {
            echo '## Reynard Browser 中文版自动构建'
            echo
            printf -- '- 类型：%s\n' "$release_kind"
            printf -- '- 版本：`%s`\n' "$VERSION"
            printf -- '- 提交：`%s`\n' "$GITHUB_SHA"
            printf -- '- 工作流运行：[#%s](https://github.com/%s/actions/runs/%s)\n' \
              "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            echo
            echo '> **未签名构建：此 IPA 没有签名，不能直接安装。**'
            echo '> 安装前必须使用 TrollStore、AltStore、SideStore、个人证书或其他兼容方式签名/侧载，并保留 App Extensions。'
            echo
            echo '该文件由 GitHub Actions 从本仓库的 Reynard、idevice、指定 Gecko 版本和补丁源码完整构建；同时附带 SHA-256 校验文件。'
            echo
            echo 'Unsigned build. This IPA is not signed and cannot be installed directly without a compatible signing or sideloading method.'
          } > "$note_file"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" "dist/$IPA_NAME" "dist/$IPA_NAME.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --title "$release_title" --notes-file "$note_file"
          else
            release_args=(
              "$release_tag"
              "dist/$IPA_NAME#未签名 IPA"
              "dist/$IPA_NAME.sha256#SHA-256 校验"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "$release_title"
              --notes-file "$note_file"
            )
            if [[ "$prerelease" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "${release_args[@]}"
          fi

          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$release_tag"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release-url=$release_url" >> "$GITHUB_OUTPUT"
          echo "Published $release_url"

      - name: Write build summary
        if: always()
        shell: bash
        env:
          IPA_NAME: ${{ steps.package.outputs.ipa-name }}
          RELEASE_URL: ${{ steps.release.outputs.release-url }}
        run: |
          {
            echo '## Reynard source build'
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- IPA: ${IPA_NAME:-not produced}"
            echo '- Signing: disabled; no certificate or provisioning profile is used.'
            echo '- Installation: the IPA must be signed by a compatible sideloading method before normal installation.'
            if [[ -n "${RELEASE_URL:-}" ]]; then
              echo "- Release: $RELEASE_URL"
            elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              echo '- Release: not published for pull request checks.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
